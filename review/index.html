<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offer Invoice Compare · Review</title><link rel="stylesheet" href="/style.css"></head><body><header class="review-header"><div class="header-content"><div class="header-copy"><h1>Offer Invoice Compare</h1><p id="status" class="review-meta" aria-live="polite"><span class="meta-item">Opening your report…</span></p></div><div class="header-action"><button id="summary" class="header-button"><span>Full report</span><span class="button-icon" aria-hidden="true">↗</span></button><button id="response-draft" class="header-button secondary"><span>Response draft</span><span class="button-icon mail-icon" aria-hidden="true"><svg viewBox="0 0 20 20" focusable="false"><path d="M3.5 5.5h13v9h-13zM4 6l6 4.5L16 6"/></svg></span></button></div></div></header><main><section class="document offer-document"><div class="bar document-bar"><div class="panel-title"><span class="panel-mark" aria-hidden="true">O</span><b>Offer</b></div><div class="zoom-controls"><button data-zoom="offer,-1" aria-label="Zoom out offer">−</button><span id="offer-zoom">100%</span><button data-zoom="offer,1" aria-label="Zoom in offer">+</button></div></div><div id="offer" class="pages"></div></section><section class="document invoice-document"><div class="bar document-bar"><div class="panel-title"><span class="panel-mark invoice-mark" aria-hidden="true">I</span><b>Invoice</b></div><div class="zoom-controls"><button data-zoom="invoice,-1" aria-label="Zoom out invoice">−</button><span id="invoice-zoom">100%</span><button data-zoom="invoice,1" aria-label="Zoom in invoice">+</button></div></div><div id="invoice" class="pages"></div></section><aside class="findings-panel"><div class="findings-header"><div class="findings-heading"><span class="panel-mark findings-mark" aria-hidden="true">Δ</span><h2>Findings</h2><span id="count"></span></div><nav aria-label="Finding navigation"><button id="prev"><span aria-hidden="true">←</span> Prev</button><button id="next">Next <span aria-hidden="true">→</span></button></nav></div><div id="findings"></div><p class="notice">Review findings and supporting evidence in the report.</p></aside></main><dialog id="report"><div class="dialog-header"><div><span id="dialog-eyebrow" class="dialog-eyebrow">OIC / FULL REPORT</span><h2 id="dialog-title">Comparison report</h2></div><div class="dialog-actions"><button id="copy">Copy report</button><button id="close" aria-label="Close report">×</button></div></div><div class="report-body"><pre id="report-text"></pre></div></dialog><script type="module" src="/app.mjs"></script></body></html>
